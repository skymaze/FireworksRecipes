name: ci

# Lightweight validation CI: pushes (main/dev) and PRs only run recipe/manifest
# validation (zero deps, no image build).

on:
  push:
    branches: ['main', 'dev']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (recipes + manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate recipes & manifest (schema + consistency + auto keys)
        run: python3 scripts/validate.py
