name: ci

on:
  push:
    branches: ['main', 'dev']
  pull_request:

jobs:
  # ---------- 校验（轻量，任意平台） ----------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配方与 manifest 校验（schema + 一致性 + auto 键）
        run: python3 scripts/validate.py
      - name: Dockerfile.model 模板一致性（--check）
        run: |
          set -e
          for m in recipes/*/; do
            name="$(basename "$m")"
            # 只对带 build.conf 且模板生成的自建模型做 --check
            if [ -f "$m/build.conf" ] && [ -d "templates/patches" ]; then
              bash scripts/render-model-dockerfile.sh --check "$name"
            fi
          done
