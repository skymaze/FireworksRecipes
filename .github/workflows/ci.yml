name: ci

# 轻量校验 CI：日常 push（main/dev）与 PR 只做配方/manifest 校验（零依赖，不构建镜像）。

on:
  push:
    branches: ['main', 'dev']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (recipes + manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: 配方与 manifest 校验（schema + 一致性 + auto 键）
        run: python3 scripts/validate.py
