#!/usr/bin/env bash
# =============================================================================
# versions.conf —— 全局版本锁
#
# 本仓库所有镜像构建依赖的源码/版本都从这里读取（被 scripts/build.sh source，
# 并以 --build-arg 显式传入 docker/vllm-b12x.Dockerfile）。
#
# ★ 现状（v0.26.0 主路径，性能优先，对齐 Anemll/dspark-vllm-gx10 GB10 配方）：
#    基座已从自定义 b12x fork（local-inference-lab/dev/gilded-gnosis）升级为
#    **主流 vllm-project/vllm v0.26.0**（2026-07 发布），全套依赖对齐上游 pin
#    （torch 2.11.0+cu130 / flashinfer 0.6.15(0472b9b) / cutlass-dsl 4.6.0 / tvm-ffi 0.1.10）。
#    DGX Spark（GB10 / sm_121a / aarch64）性能由 Anemll 配方移植而来：
#      - 显式 12.1a 编译 arch（TORCH_CUDA_ARCH_LIST + CUDA_SUPPORTED_ARCHS 保留）
#      - nvfp4_ds_mla KV dtype + FlashInfer 原生 SM120/SM121 sparse-MLA（overlay）
#      - lukealonso/b12x（SparkInfer）MXFP4 MoE（--moe-backend flashinfer_b12x；真机
#        实测其 prefill 在 v0.26.0 集成下不可用 ~88 tok/s，默认配置 MoE=auto/DeepGEMM）
#      - dspark MTP 投机解码（v0.26.0 主流内建）
#    注：b12x 内核未并入 v0.26.0 主线，以独立包安装（SPARKINFER_REPO 不为空）。
#
# 仓库内不引用/不依赖任何第三方项目的构建产物或镜像，所有组件均本地源码编译。
# =============================================================================

# ---- 基础镜像（构建期 CUDA 开发镜像；arm64 / DGX Spark GB10 目标）----
# v0.26.0 上游 Docker 默认 ubuntu22.04；本仓库先沿用 24.04（先前已验证），
# 若构建受阻再对齐上游 22.04。
CUDA_IMAGE="nvidia/cuda:13.0.2-devel-ubuntu24.04"

# ---- GPU 架构 ----
# DGX Spark GB10: Blackwell 消费级架构 12.1a（PyTorch/FlashInfer arch 列表写法）
GPU_ARCH="12.1a"
# NCCL 源码编译目标 gencode（CUDA 反写法：sm_121）
NCCL_NVCC_GENCODE="-gencode=arch=compute_121,code=sm_121"

# ---- PyTorch ----
# v0.26.0 锁定 torch==2.11.0（CMake TORCH_SUPPORTED_VERSION_CUDA=2.11.0；2.12 会告警）。
# wheel 从 cu130 索引安装（aarch64）。
TORCH_VERSION="2.11.0"
TORCH_INDEX_URL="https://download.pytorch.org/whl/cu130"

# ---- vLLM ----
# ★ 主路径：主流 vllm-project/vllm v0.26.0（release tag）。
VLLM_REPO="https://github.com/vllm-project/vllm.git"
VLLM_REF="v0.26.0"

# ---- B12X（SparkInfer）内核包 ----
# lukealonso/b12x：MXFP4 MoE 内核（GB10 性能关键），以 flashinfer_b12x 后端消费。
# REF 建议 pin commit（Anemll 验证的 7dc6fb8 == b12x 0.15.3）；必须与 v0.26.0
# modular-MoE oracle API 兼容（P3 overlay 内适配验证）。
SPARKINFER_REPO="https://github.com/lukealonso/b12x.git"
SPARKINFER_REF="7dc6fb8fcc6446ea093537d1657df81985fa5f43"
B12X_VERSION="0.15.3"

# ---- FlashInfer ----
# 移植 Anemll sparse-MLA attention overlay 后，flashinfer 需升到 Anemll 验证的
# 0472b9b（~0.6.15）：新增 _packed_kv_page_block_size() 从 KV 张量推导打包页块
# （兼容 block=256 + SM120 decode 64-token 子块），并配套 sparse_mla_sm120 解码；
# v0.26.0 默认 pin 0.6.14 无法处理该页矛盾（真机已验证 0.6.14 崩溃）。
FLASHINFER_REPO="https://github.com/flashinfer-ai/flashinfer.git"
FLASHINFER_REF="0472b9b3f2fba11b463f8526f390297d52a8aad7"

# ---- DeepGEMM ----
DEEPGEMM_REPO="https://github.com/deepseek-ai/DeepGEMM.git"
DEEPGEMM_REF="a6b593d2826719dcf4892609af7b84ee23aaf32a"

# ---- 运行时内核/FFI 依赖（PyPI，供 runner pip 安装）----
# v0.26.0 requirements/cuda.txt 对齐：cutlass-dsl 4.6.0 / apache-tvm-ffi 0.1.10；
# cuda-python 13.3.1（nvidia 工具链）。
CUTLASS_DSL_VERSION="4.6.0"
APACHE_TVM_FFI_VERSION="0.1.10"
CUDA_PYTHON_VERSION="13.3.1"

# ---- 编译参数 ----
BUILD_JOBS="16"

# ---- 镜像命名（本地 tag 前缀与版本；push-registry 时再拼接仓库地址）----
IMAGE_PREFIX="fireworks-models"
# 0.2.0 = v0.26.0 主流基座（自 0.1.0 fork 基座迁移）；base 镜像版本。
# 模型专属镜像 tag 见 models/*/build.conf 的 IMAGE_TAG（0.3.0 = fw-warmup 补丁 +
# JIT 缓存 bake 层 /opt/fw/vllm-cache-seed）。
BASE_VERSION="0.2.0"
