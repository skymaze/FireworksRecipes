#!/usr/bin/env bash
# =============================================================================
# build.conf —— 模型构建定义（被 scripts/build.sh source）
# =============================================================================

# 模型标识
MODEL_NAME="deepseek-v4-flash-0731"
MODEL_TITLE="DeepSeek-V4-Flash-0731"
MODEL_ID="deepseek-ai/DeepSeek-V4-Flash-0731"
SERVED_MODEL_NAME="deepseek-v4-flash-0731"

# 基础 runner tag（版本来自 versions.conf；如需覆盖可在运行 build.sh 前导出 BASE_TAG）
BASE_TAG="${IMAGE_PREFIX:-fireworks-models}/base-vllm-b12x:${BASE_VERSION:-0.2.0}"

# 本模型专属镜像 tag（决定 recipe.json 里 image 字段，build.sh 会校验一致）
IMAGE_REPO="${IMAGE_PREFIX:-fireworks-models}/deepseek-v4-flash-0731"
IMAGE_TAG="${IMAGE_TAG:-0.3.1}"

# 烘培进镜像的补丁：以 Dockerfile.model 中的显式 COPY + RUN 为单一事实源。
#   当前有：patches/hybrid-draft-loader —— 目标 instanttensor / 同 checkpoint 草稿 lazy safetensors

# 模型调优环境变量：直接维护在 Dockerfile.model 的 ENV 块（无重复声明）。

# —— 供 templates/Dockerfile.model 渲染（scripts/render-model-dockerfile.sh 读取）——
# 烘培补丁列表：templates/patches/<dir>.inc 与 models/<model>/patches/<dir>/ 一一对应
MODEL_PATCH_DIRS=(hybrid-draft-loader fw-warmup)
# 镜像 OCI 元数据（默认 title/description 见 renderer）
MODEL_LABEL_TITLE="Fireworks DeepSeek-V4-Flash-0731"
MODEL_LABEL_DESC="Dedicated serving image for deepseek-ai/DeepSeek-V4-Flash-0731 (mainline vLLM v0.26.0 + GB10 overlay)"
# 追加到通用调优 ENV 之后的模型专属 ENV（可空；多行如 "KEY=value2"）
MODEL_EXTRA_ENV=()
